<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>스테이블코인 수익률 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:#000;color:#e4e4e7;font-family:'Noto Sans KR',sans-serif;min-height:100vh}

/* Nav */
.top-nav{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border-bottom:1px solid #1a1a1a;padding:0 16px;display:flex;align-items:center;justify-content:center;height:52px}
.nav-title{font-size:14px;font-weight:600;color:#e4e4e7;white-space:nowrap}

/* Container */
.container{max-width:960px;margin:0 auto;padding:16px 12px 60px}

/* Cards */
.card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;padding:16px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:#a1a1aa;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.summary-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;padding:14px 16px}
.summary-label{font-size:11px;color:#71717a;font-weight:500;margin-bottom:4px}
.summary-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:#22c55e}
.summary-value.neutral{color:#f4f4f5}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}
.filter-group{display:flex;flex-direction:column;gap:6px}
.filter-label{font-size:11px;color:#71717a;font-weight:500}
.filter-buttons{display:flex;flex-wrap:wrap;gap:4px}
.tab{background:#111;border:1px solid #1a1a1a;border-radius:6px;padding:6px 12px;font-size:12px;color:#a1a1aa;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s}
.tab:hover{border-color:#333;color:#e4e4e7}
.tab.active{background:#a78bfa;border-color:#a78bfa;color:#000;font-weight:600}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #1a1a1a;margin-bottom:0}
.table-title-text{font-size:13px;font-weight:600;color:#a1a1aa}
.table-count{font-size:11px;color:#71717a}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:#71717a;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:color 0.2s;white-space:nowrap}
th:hover{color:#e4e4e7}
th.sorted{color:#a78bfa}
td{padding:12px;font-size:13px;border-bottom:1px solid #111;white-space:nowrap}
tr:hover{background:#111}

.protocol-cell{display:flex;align-items:center;gap:8px}
.protocol-icon{width:26px;height:26px;border-radius:6px;background:#1a1a1a;border:1px solid #27272a;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#a78bfa;flex-shrink:0}
.protocol-name{font-weight:600;color:#f4f4f5;font-size:13px}

.chain-badge{display:inline-block;padding:4px 8px;background:#1a1a1a;border:1px solid #27272a;border-radius:4px;font-size:11px;color:#a1a1aa;font-family:'JetBrains Mono',monospace}
.stable-badge{display:inline-block;padding:4px 8px;background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.2);border-radius:4px;font-size:11px;color:#a78bfa;font-weight:600;font-family:'JetBrains Mono',monospace}

.apy-value{font-family:'JetBrains Mono',monospace;font-weight:700;color:#22c55e;font-size:14px}
.tvl-value{font-family:'JetBrains Mono',monospace;color:#a1a1aa;font-size:13px}

.empty-state{padding:40px 20px;text-align:center;color:#71717a;font-size:13px}

/* Watermark */
.watermark{position:relative}
.watermark::after{content:'Herdvibe.com';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;color:rgba(255,255,255,0.06);pointer-events:none;z-index:2;letter-spacing:2px}

/* Share */
.share-bar{display:flex;gap:6px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.share-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:1px solid #222;background:#0a0a0a;color:#a1a1aa;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s}
.share-btn:hover{border-color:#444;color:#e4e4e7}
.share-btn svg{width:14px;height:14px;flex-shrink:0}
.share-btn.twitter:hover{border-color:#1d9bf0;color:#1d9bf0}
.share-btn.kakao:hover{border-color:#fee500;color:#fee500}
.share-btn.telegram:hover{border-color:#26a5e4;color:#26a5e4}
.share-btn.instagram:hover{border-color:#e1306c;color:#e1306c}
.share-btn.instagram.copied{border-color:#e1306c;color:#e1306c}
.share-btn.copy:hover{border-color:#22c55e;color:#22c55e}
.share-btn.copied{border-color:#22c55e;color:#22c55e}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#22c55e;color:#000;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all 0.3s ease;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Last updated */
.last-updated{text-align:center;font-size:11px;color:#52525b;margin-top:8px}

/* Responsive */
@media(max-width:640px){
  .top-nav{padding:0 10px}
  .nav-title{font-size:12px}
  .summary-value{font-size:16px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  th,td{padding:8px 6px;font-size:12px}
  .protocol-icon{display:none}
  .watermark::after{font-size:20px}
}
</style>
</head>
<body>

    <div class="nav-title">스테이블코인 수익률 대시보드</div>

            <button class="share-btn copy" onclick="copyLink(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>링크복사</button>
        </div>

    <div class="last-updated" id="last-updated"></div>
</div>

<div class="toast" id="toast"></div>

let currentStableFilter = 'all';

let currentSort = { field: 'apy', desc: true };

// Toast
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// Format
function formatTvl(tvl) {
    if (tvl >= 1e9) return '$' + (tvl / 1e9).toFixed(2) + 'B';
    if (tvl >= 1e6) return '$' + (tvl / 1e6).toFixed(2) + 'M';
    if (tvl >= 1e3) return '$' + (tvl / 1e3).toFixed(0) + 'K';
    return '$' + tvl.toFixed(0);
}

// Filters
function initFilters() {
    const stableContainer = document.getElementById('stable-filters');
    STABLECOINS.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.filter = s;
        btn.textContent = s;
        stableContainer.appendChild(btn);
    });

    const chainContainer = document.getElementById('chain-filters');
    CHAINS.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.filter = c;
        btn.textContent = c;
        chainContainer.appendChild(btn);
    });

    stableContainer.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
            stableContainer.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStableFilter = btn.dataset.filter;
            renderTable();
        });
    });

    chainContainer.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
            chainContainer.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentChainFilter = btn.dataset.filter;
            renderTable();
        });
    });
}

// Sort
function initSort() {
    document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
            const field = th.dataset.sort;
            if (currentSort.field === field) { currentSort.desc = !currentSort.desc; }
            else { currentSort.field = field; currentSort.desc = true; }
            document.querySelectorAll('th').forEach(t => {
                t.classList.remove('sorted');
                t.textContent = t.textContent.replace(' ↓','').replace(' ↑','');
            });
            th.classList.add('sorted');
            th.textContent += currentSort.desc ? ' ↓' : ' ↑';
            renderTable();
        });
    });
}

// Table
function renderTable() {
    let filtered = POOLS.filter(p => {
        if (currentStableFilter !== 'all' && p.symbol !== currentStableFilter) return false;
        if (currentChainFilter !== 'all' && p.chain !== currentChainFilter) return false;
        return true;
    });

    filtered.sort((a, b) => {
        let aV = a[currentSort.field], bV = b[currentSort.field];
        if (typeof aV === 'string') { aV = aV.toLowerCase(); bV = bV.toLowerCase(); }
        return currentSort.desc ? (bV > aV ? 1 : -1) : (aV > bV ? 1 : -1);
    });

    updateStats(filtered);
    const tbody = document.getElementById('table-body');

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">조건에 맞는 풀이 없습니다</td></tr>';
        document.getElementById('table-count').textContent = '0개 풀';
        return;
    }

    document.getElementById('table-count').textContent = `${filtered.length}개 풀`;

    tbody.innerHTML = filtered.map(p => `
        <tr>
            <td><div class="protocol-cell"><div class="protocol-icon">${p.protocol.substring(0,2).toUpperCase()}</div><span class="protocol-name">${p.protocol}</span></div></td>
            <td><span class="chain-badge">${p.chain}</span></td>
            <td><span class="stable-badge">${p.symbol}</span></td>
            <td><span class="apy-value">${p.apy.toFixed(2)}%</span></td>
            <td><span class="tvl-value">${formatTvl(p.tvl)}</span></td>
        </tr>
    `).join('');
}

// Stats
function updateStats(pools) {
    if (pools.length === 0) {
        document.getElementById('stat-max-apy').textContent = '-';
        document.getElementById('stat-avg-apy').textContent = '-';
        document.getElementById('stat-pool-count').textContent = '0';
        document.getElementById('stat-total-tvl').textContent = '-';
        return;
    }
    const maxApy = Math.max(...pools.map(p => p.apy));
    const avgApy = pools.reduce((s, p) => s + p.apy, 0) / pools.length;
    const totalTvl = pools.reduce((s, p) => s + p.tvl, 0);
    document.getElementById('stat-max-apy').textContent = maxApy.toFixed(2) + '%';
    document.getElementById('stat-avg-apy').textContent = avgApy.toFixed(2) + '%';
    document.getElementById('stat-pool-count').textContent = pools.length;
    document.getElementById('stat-total-tvl').textContent = formatTvl(totalTvl);
}

// Init
initFilters();
initSort();
renderTable();
document.getElementById('last-updated').textContent = '마지막 업데이트: ' + new Date().toLocaleString('ko-KR') + ' · TVL $100K 이상 · DeFiLlama 데이터';
</script>
</body>
